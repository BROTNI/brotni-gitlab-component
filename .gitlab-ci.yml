# GitLab CI/CD catalog component validation pipeline
# Tests and lints the component templates to ensure they are valid before publishing.

spec:
  inputs:
    # No inputs — this is the component's own CI pipeline, not the component itself.

stages:
  - validate
  - publish

variables:
  # Disable default clone behavior for validation jobs that don't need it
  GIT_DEPTH: "1"

validate-templates:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache yq
  script:
    - echo "Validating submit-candidate template..."
    - yq e '.' templates/submit-candidate/template.yml > /dev/null
    - echo "Validating wait-for-result template..."
    - yq e '.' templates/wait-for-result/template.yml > /dev/null
    - echo "All templates are valid YAML."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

validate-examples:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache yq
  script:
    - echo "Validating examples..."
    - for f in examples/*.gitlab-ci.yml; do
        echo "Checking $f ...";
        yq e '.' "$f" > /dev/null;
      done
    - echo "All examples are valid YAML."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Catalog release job — triggered by tags following semantic versioning.
release:
  stage: publish
  image: alpine:latest
  script:
    - echo "Component version $CI_COMMIT_TAG released to catalog."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: catalog
