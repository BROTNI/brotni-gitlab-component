# Example: Register a GitLab merge request as a candidate in a Brotni campaign.
#
# Prerequisites:
#   - BROTNI_API_URL:     set as a CI/CD variable (group or project level)
#   - BROTNI_TOKEN:       set as a masked/protected CI/CD variable
#   - BROTNI_CAMPAIGN_ID: the campaign to register candidates with (create it
#                         first, e.g. with `brotni campaign create`)
#
# How to use:
#   Copy this file to your project as .gitlab-ci.yml or merge it with your pipeline.

include:
  - component: $CI_SERVER_FQDN/brotni/brotni-gitlab-component/submit-candidate@~latest
    inputs:
      brotni_api_url: "$BROTNI_API_URL"
      brotni_token_variable: "BROTNI_TOKEN"
      campaign_id: "$BROTNI_CAMPAIGN_ID"
      execution_recipe: "simulation/recipe.yaml"

stages:
  - build
  - test
  - simulate

build:
  stage: build
  image: alpine:latest
  script:
    - echo "Build your project here"

test:
  stage: test
  image: alpine:latest
  needs: [build]
  script:
    - echo "Run your tests here"

# The submit-candidate job runs automatically in .pre and registers the current
# MR commit as a candidate (idempotently, keyed by mr-<iid>) in the campaign.
