# Example: Submit a GitLab merge request commit as a Brotni simulation candidate.
#
# Prerequisites:
#   - BROTNI_API_URL: set as a CI/CD variable (group or project level)
#   - BROTNI_TOKEN:   set as a masked/protected CI/CD variable
#
# How to use:
#   Copy this file to your project as .gitlab-ci.yml or merge it with your existing pipeline.

include:
  - component: $CI_SERVER_FQDN/brotni/brotni-gitlab-component/submit-candidate@~latest
    inputs:
      brotni_api_url: "$BROTNI_API_URL"
      brotni_token_variable: "BROTNI_TOKEN"
      simulation_spec: "simulation/spec.yaml"
      execution_recipe: "simulation/recipe.yaml"
      candidate_name: "$CI_PROJECT_NAME-mr-$CI_MERGE_REQUEST_IID"
      campaign_id: "$BROTNI_CAMPAIGN_ID"
      publish_status: "true"

stages:
  - build
  - test
  - simulate

build:
  stage: build
  image: alpine:latest
  script:
    - echo "Build your project here"
  artifacts:
    paths:
      - build/

test:
  stage: test
  image: alpine:latest
  needs: [build]
  script:
    - echo "Run your tests here"

# The submit-candidate component job runs automatically in .pre
# and submits the current commit to the Brotni simulation workflow.
