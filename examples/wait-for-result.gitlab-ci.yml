# Example: Register a candidate and report the campaign decision in one pipeline.
#
# Prerequisites:
#   - BROTNI_API_URL:     set as a CI/CD variable
#   - BROTNI_TOKEN:       set as a masked/protected CI/CD variable
#   - BROTNI_CAMPAIGN_ID: the campaign to register candidates with
#
# This example uses both components:
#   1. submit-candidate — registers the MR as a candidate (runs in .pre)
#   2. wait-for-result  — best-effort report of the campaign decision (runs in .post)
#
# Note: results are populated once the studio has scored the candidates; the
# decision report is non-blocking and may be empty in the same pipeline run.

include:
  - component: $CI_SERVER_FQDN/brotni/brotni-gitlab-component/submit-candidate@~latest
    inputs:
      brotni_api_url: "$BROTNI_API_URL"
      brotni_token_variable: "BROTNI_TOKEN"
      campaign_id: "$BROTNI_CAMPAIGN_ID"
      execution_recipe: "simulation/recipe.yaml"

  - component: $CI_SERVER_FQDN/brotni/brotni-gitlab-component/wait-for-result@~latest
    inputs:
      brotni_api_url: "$BROTNI_API_URL"
      brotni_token_variable: "BROTNI_TOKEN"
      campaign_id: "$BROTNI_CAMPAIGN_ID"

stages:
  - build
  - test

build:
  stage: build
  image: alpine:latest
  script:
    - echo "Build your project here"

test:
  stage: test
  image: alpine:latest
  needs: [build]
  script:
    - echo "Run tests here"

# After all stages, in .post, wait-for-result prints the current campaign
# decision and exposes BROTNI_CAMPAIGN_ID for downstream jobs.
report-campaign:
  stage: .post
  image: alpine:latest
  needs:
    - job: wait-for-result
      artifacts: true
  script:
    - echo "Campaign: $BROTNI_CAMPAIGN_ID"
  rules:
    - when: always
