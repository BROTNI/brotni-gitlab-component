# GitLab CI/CD Component: submit-candidate
# Registers a GitLab merge request, commit, or OCI artifact as a candidate in an
# existing Brotni simulation campaign, via `brotni campaign add-candidate`.
# Registration is idempotent by candidate name.
#
# Usage in .gitlab-ci.yml:
#   include:
#     - component: $CI_SERVER_FQDN/brotni/brotni-gitlab-component/submit-candidate@~latest
#       inputs:
#         campaign_id: "$BROTNI_CAMPAIGN_ID"

spec:
  inputs:
    # Required: URL of the Brotni API endpoint
    brotni_api_url:
      description: "Base URL of the Brotni API (e.g. https://api.brotni.example.com)"
      default: "$BROTNI_API_URL"

    # Name of the CI variable that holds the Brotni API token.
    # The variable itself is resolved at runtime; its value is never logged.
    brotni_token_variable:
      description: "Name of the CI variable containing the Brotni API token"
      default: "BROTNI_TOKEN"

    # Required: the campaign to register this candidate with.
    campaign_id:
      description: "Brotni campaign ID to register this candidate with (required)"
      default: ""

    # Recipe describing how this candidate runs.
    execution_recipe:
      description: "Path or URL to the execution recipe file"
      default: ""

    # OCI artifact inputs (optional — use for artifact-based candidates)
    artifact_uri:
      description: "OCI artifact URI (e.g. registry.example.com/myimage)"
      default: ""

    artifact_digest:
      description: "OCI artifact digest (sha256:...)"
      default: ""

    # Stable candidate name. Defaults to mr-<iid> on merge request pipelines (so
    # re-runs upsert instead of duplicating); falls back to the project + short
    # SHA otherwise.
    candidate_name:
      description: "Stable candidate name (defaults to mr-<iid> or project-<short sha>)"
      default: ""

    source_kind:
      description: "Candidate source kind: git_change, container_image, or config_bundle (inferred when empty)"
      default: ""

    # Docker image used to run brotni-cli
    brotni_cli_image:
      description: "Docker image that provides brotni-cli"
      default: "ghcr.io/brotni/brotni-cli:latest"

---

submit-candidate:
  image: $[[ inputs.brotni_cli_image ]]
  stage: .pre
  variables:
    BROTNI_API_URL: $[[ inputs.brotni_api_url ]]
    _BROTNI_TOKEN_VAR: $[[ inputs.brotni_token_variable ]]
    CAMPAIGN_ID: $[[ inputs.campaign_id ]]
    CANDIDATE_NAME: $[[ inputs.candidate_name ]]
    EXECUTION_RECIPE: $[[ inputs.execution_recipe ]]
    ARTIFACT_URI: $[[ inputs.artifact_uri ]]
    ARTIFACT_DIGEST: $[[ inputs.artifact_digest ]]
    SOURCE_KIND: $[[ inputs.source_kind ]]
  script:
    - |
      set -euo pipefail

      if [ -z "$CAMPAIGN_ID" ]; then
        echo "ERROR: campaign_id is required — register candidates in an existing campaign." >&2
        exit 1
      fi

      # Resolve the token from the named variable — never echo the token value.
      BROTNI_TOKEN="${!_BROTNI_TOKEN_VAR:-}"
      if [ -z "$BROTNI_TOKEN" ]; then
        echo "ERROR: Variable '$_BROTNI_TOKEN_VAR' is not set or is empty." >&2
        exit 1
      fi

      # Stable candidate name: mr-<iid> on MR pipelines, else project-<short sha>.
      NAME="$CANDIDATE_NAME"
      if [ -z "$NAME" ]; then
        if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
          NAME="mr-$CI_MERGE_REQUEST_IID"
        else
          NAME="$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
        fi
      fi

      ARGS=(
        campaign add-candidate
        --id     "$CAMPAIGN_ID"
        --name   "$NAME"
        --provider gitlab
        --repo   "$CI_PROJECT_PATH"
        --commit "$CI_COMMIT_SHA"
        --output json
      )
      [ -n "$EXECUTION_RECIPE" ] && ARGS+=(--recipe          "$EXECUTION_RECIPE")
      [ -n "$ARTIFACT_URI"     ] && ARGS+=(--artifact-uri     "$ARTIFACT_URI")
      [ -n "$ARTIFACT_DIGEST"  ] && ARGS+=(--artifact-digest  "$ARTIFACT_DIGEST")
      [ -n "$SOURCE_KIND"      ] && ARGS+=(--source-kind      "$SOURCE_KIND")
      [ -n "${CI_MERGE_REQUEST_IID:-}" ] && ARGS+=(--pr       "$CI_MERGE_REQUEST_IID")

      # Register the candidate — token passed via env var, never via CLI argument.
      RESP="$(BROTNI_API_URL="$BROTNI_API_URL" BROTNI_TOKEN="$BROTNI_TOKEN" brotni "${ARGS[@]}")"
      echo "$RESP"

      # Extract the studio-minted candidate ID without requiring jq.
      CANDIDATE_ID="$(printf '%s' "$RESP" | grep -o '"id":"[^"]*"' | head -1 | sed 's/"id":"//; s/"$//')"

      {
        echo "BROTNI_CAMPAIGN_ID=$CAMPAIGN_ID"
        echo "BROTNI_CANDIDATE_ID=$CANDIDATE_ID"
      } >> brotni.env
  artifacts:
    reports:
      dotenv: brotni.env
    expire_in: 1 week
  rules:
    - when: always
