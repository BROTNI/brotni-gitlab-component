# GitLab CI/CD Component: wait-for-result
# Best-effort report of the campaign decision for the registered candidate.
#
# In the campaign model there is no per-candidate "job" to poll: scoring is
# comparative and only exists once the studio has run the candidates and
# ingested metrics. This job therefore reports the current campaign decision
# (non-blocking) and exposes it to downstream jobs, rather than waiting on a
# job that does not exist.
#
# Usage in .gitlab-ci.yml:
#   include:
#     - component: $CI_SERVER_FQDN/brotni/brotni-gitlab-component/wait-for-result@~latest

spec:
  inputs:
    brotni_api_url:
      description: "Base URL of the Brotni API (e.g. https://api.brotni.example.com)"
      default: "$BROTNI_API_URL"

    brotni_token_variable:
      description: "Name of the CI variable containing the Brotni API token"
      default: "BROTNI_TOKEN"

    campaign_id:
      description: "Campaign ID to report the decision for (from submit-candidate output)"
      default: "$BROTNI_CAMPAIGN_ID"

    brotni_cli_image:
      description: "Docker image that provides brotni-cli"
      default: "ghcr.io/brotni/brotni-cli:latest"

---

wait-for-result:
  image: $[[ inputs.brotni_cli_image ]]
  stage: .post
  variables:
    BROTNI_API_URL: $[[ inputs.brotni_api_url ]]
    _BROTNI_TOKEN_VAR: $[[ inputs.brotni_token_variable ]]
    CAMPAIGN_ID: $[[ inputs.campaign_id ]]
  script:
    - |
      set -euo pipefail

      if [ -z "$CAMPAIGN_ID" ]; then
        echo "ERROR: campaign_id is not set. Ensure submit-candidate ran first." >&2
        exit 1
      fi

      BROTNI_TOKEN="${!_BROTNI_TOKEN_VAR:-}"
      if [ -z "$BROTNI_TOKEN" ]; then
        echo "ERROR: Variable '$_BROTNI_TOKEN_VAR' is not set or is empty." >&2
        exit 1
      fi

      # Best-effort: print the current campaign decision. This does not block —
      # the report is populated once the studio has scored the candidates.
      echo "Campaign decision for $CAMPAIGN_ID:"
      BROTNI_API_URL="$BROTNI_API_URL" BROTNI_TOKEN="$BROTNI_TOKEN" \
        brotni campaign decision --id "$CAMPAIGN_ID" || \
        echo "Decision not available yet (candidates not scored)."

      echo "BROTNI_CAMPAIGN_ID=$CAMPAIGN_ID" >> brotni-result.env
  artifacts:
    reports:
      dotenv: brotni-result.env
    expire_in: 1 week
  rules:
    - when: always
